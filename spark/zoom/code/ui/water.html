<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WATER sonar</title>
<style>
:root{--bg:#0e1116;--fg:#e6e8eb;--mut:#9aa3ad;--card:#161b22;--line:#2a313b;--acc:#3cc8ff;--warn:#f0b429;--hb:#ff3b5c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px system-ui,sans-serif}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line)}
h1{font-size:16px;margin:0 8px 0 0}button{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:4px 10px;font:inherit;cursor:pointer}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 340px;gap:10px;padding:10px;height:calc(100vh - 50px)}
@media(max-width:1000px){.grid{grid-template-columns:1fr;height:auto}}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px;overflow:hidden;display:flex;flex-direction:column;min-height:0}
.card h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:0 0 6px}
.imgbox{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#05070a;border-radius:6px}
.imgbox img{max-width:100%;max-height:100%;object-fit:contain}
.sim{background:#3d2a08;color:var(--warn);padding:6px 8px;border-radius:6px;font-weight:600;font-size:12.5px;margin-bottom:6px}
table{border-collapse:collapse;width:100%;font-size:12.5px}td{padding:2px 4px;border-bottom:1px solid var(--line)}td.n{text-align:right}
.mut{color:var(--mut);font-size:12px}.side{overflow:auto}
</style></head><body>
<header><h1>WATER</h1><button id="play">▶ sonar replay</button><button id="reset">↺</button><span class="mut" id="clock"></span>
<span class="mut">COP view with fields: <a style="color:var(--acc)" id="coplink" href="#">:8143 → water (sonar)</a></span></header>
<div class="grid">
 <div class="card"><h2>Sonar mosaic forming along the track</h2><div class="sim" id="label">FLS frames placed along a real AUV track — SIMULATED placement</div><div class="imgbox"><img id="mos"></div></div>
 <div class="card"><h2>Current ping: raw forward-looking-sonar frame + detector</h2><div class="mut" id="fmeta"></div><div class="imgbox"><canvas id="raw" style="max-width:100%;max-height:100%"></canvas></div></div>
 <div class="card side"><h2>Call-outs</h2><div id="calls" class="mut">—</div><h2 style="margin-top:10px">Detector (UATD, held-out Test_2)</h2><div id="res" class="mut">—</div><h2 style="margin-top:10px">Provenance</h2><div id="prov" class="mut"></div></div>
</div>
<script>
const $=id=>document.getElementById(id); let M=null, R=null, k=0, timer=null; const imgs={};
$('coplink').href=`${location.protocol}//${location.hostname}:8143`;
function show(){ if(!M) return; const fr=M.frames.filter(f=>f.ping<=k).slice(-1)[0]; if(fr) $('mos').src='wmosaic/frames/'+fr.png;
  const t=M.track[Math.max(0,k-1)]; $('clock').textContent=`ping ${k} / ${M.n_pings}`;
  if(t){ $('fmeta').textContent=`UATD_Test_2/${t.frame} · range ${t.range_m.toFixed(1)} m · heading ${t.heading_deg}° · AUV depth ${t.depth_m} m`; drawRaw(t.frame, k-1); }
  const cs=M.callouts.filter(c=>c.ping<k), hb=cs.filter(c=>c.cls==='human body');
  $('calls').innerHTML=`<b style="color:var(--hb)">${hb.length} human-body call-outs</b> → fusion inbox (sensor sonar_fls) → field over water cells<br>${cs.length-hb.length} other objects (grey, not sent)<table>${hb.map(c=>`<tr><td>ping ${c.ping+1}</td><td>${c.frame}</td><td class="n">${c.conf.toFixed(2)}</td><td class="n">${c.range_m.toFixed(1)} m</td></tr>`).join('')}</table>`; }
function drawRaw(f, ping){ const cv=$('raw'), g=cv.getContext('2d'); let im=imgs[f]; if(!im){ im=new Image(); im.onload=()=>drawRaw(f,ping); im.src='wraw/'+f; imgs[f]=im; return; } if(!im.complete) return;
  cv.width=im.naturalWidth/2; cv.height=im.naturalHeight/2; g.filter='brightness(7) contrast(1.6)'; g.drawImage(im,0,0,cv.width,cv.height); g.filter='none';
  for(const c of M.callouts.filter(c=>c.ping===ping)){ const b=c.box_px; if(!b) continue; g.strokeStyle=c.cls==='human body'?'#ff3b5c':'#aaa'; g.lineWidth=c.cls==='human body'?3:1.5; g.strokeRect(b[0]/2,b[1]/2,(b[2]-b[0])/2,(b[3]-b[1])/2); g.fillStyle=g.strokeStyle; g.font='14px system-ui'; g.fillText(`${c.cls} ${c.conf.toFixed(2)}`,b[0]/2,b[1]/2-4); } }
$('play').onclick=()=>{ if(!M) return; if(timer){ clearInterval(timer); timer=null; $('play').textContent='▶ sonar replay'; return; } if(k>=M.n_pings) k=0; $('play').textContent='❚❚ pause';
  timer=setInterval(()=>{ k++; show(); if(k%6===0||k>=M.n_pings) fetch(`api/emit/water?ping=${k}`,{method:'POST'}); if(k>=M.n_pings){ clearInterval(timer); timer=null; $('play').textContent='▶ sonar replay'; } }, M.interval_ms||350); };
$('reset').onclick=()=>{ clearInterval(timer); timer=null; k=0; fetch('api/emit/reset?kind=water',{method:'POST'}); $('play').textContent='▶ sonar replay'; show(); };
(async()=>{ M=await (await fetch('api/water')).json(); R=(await (await fetch('api/results')).json()).uatd;
  $('label').textContent=M.label; const h=M.human_check||{};
  $('prov').innerHTML=`<b>Track:</b> ${M.track_source}<br><b>Frames:</b> ${M.frames_source}<br><b>Detector:</b> ${M.detector}<br>${M.n_pings} pings, one every ${M.pose_step} navigation poses; mosaic 0.2 m/px, max-accumulated, log-stretched. Polar→Cartesian assumes row 0 = nearest range bin.<br><b>On these ${M.n_pings} frames:</b> ${h.human_callouts} human-body call-outs, ${h.match_label_iou50} match a labelled body (IoU ≥ 0.5); ${h.labelled_human_bodies_in_placed_frames} labelled bodies in the frames.<br>The detector output IS the overlay here: deterministic call-outs and the "overlay model" are the same thing.`;
  if(R){ const t=R.test; $('res').innerHTML=`<table><tr><td>mAP50 (Test_2, held out)</td><td class="n">${t.mAP50.toFixed(3)}</td></tr><tr><td><b>human body AP50</b></td><td class="n"><b>${t.per_class_AP50['human body'].toFixed(3)}</b></td></tr><tr><td>precision / recall</td><td class="n">${t.P.toFixed(2)} / ${t.R.toFixed(2)}</td></tr></table><div>UATD's human body is a submerged dummy; same campaign and sonar as training (in-distribution).</div>`; }
  k=M.n_pings; show(); })();
</script></body></html>
